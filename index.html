<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive KOF Fighting Game Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #ffcc00;
            --bg-dark: #0a0b10;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(20, 22, 35, 0.85) 0%, rgba(5, 6, 10, 0.96) 100%);
            z-index: -2;
        }

        .showcase-container {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding: 20px;
        }

        .showcase-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 40px;
            z-index: 10;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .title-line-1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--primary-neon);
            text-shadow: 0 0 18px var(--primary-neon);
            transition: color 0.4s ease, text-shadow 0.4s ease;
            line-height: 1.1;
        }

        .title-line-2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #ffffff;
            margin-top: 4px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .shirou-badge {
            background: rgba(15, 17, 26, 0.9);
            border: 2px solid var(--primary-neon);
            padding: 8px 20px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.25);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .shirou-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff3366, #ffcc00, #00e5ff, #cc33ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 204, 0, 0.4));
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .shirou-id {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a0a5b8;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .carousel-stage {
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1200px;
        }

        .card-slot {
            position: absolute;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .card-slot.side-left, .card-slot.side-right {
            width: 240px;
            height: 360px;
            transform: scale(0.78) skewX(-8deg);
            opacity: 0.5;
            filter: brightness(0.4) grayscale(100%);
            z-index: 2;
            pointer-events: auto;
        }

        .card-slot.side-left { transform: translateX(-280px) scale(0.78) skewX(-8deg); }
        .card-slot.side-right { transform: translateX(280px) scale(0.78) skewX(-8deg); }

        .card-slot.center {
            width: 360px;
            height: 440px;
            transform: translateX(0) scale(1) skewX(0deg);
            opacity: 1;
            filter: brightness(1) grayscale(0%);
            z-index: 5;
        }

        .card-frame {
            width: 100%;
            height: 100%;
            background: rgba(12, 14, 22, 0.9);
            border: 3px solid var(--primary-neon);
            box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,204,0,0.15);
            position: relative;
            overflow: hidden;
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .side-left .card-frame, .side-right .card-frame {
            border-color: #555;
            box-shadow: none;
        }

        .character-img-container {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .character-img-container img {
            width: 120%;
            height: 110%;
            object-fit: cover;
            object-position: center bottom;
            transition: transform 0.5s ease;
        }

        .card-slot.center:hover img {
            transform: scale(1.05);
        }

        .card-overlay-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 6;
            pointer-events: none;
        }

        .card-slot.center .main-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }

        .showcase-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 10;
        }

        .music-player {
            background: rgba(14, 16, 24, 0.95);
            border: 2px solid var(--primary-neon);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(255,204,0,0.2);
            transition: border-color 0.4s ease;
            width: 350px;
        }

        .track-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-neon), #ff6600);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #000;
            box-shadow: 0 0 10px var(--primary-neon);
            transition: background 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        .track-icon:hover {
            transform: scale(1.08);
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.7rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--primary-neon);
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s ease, color 0.4s ease;
            padding: 4px;
        }

        .ctrl-btn:hover {
            transform: scale(1.15);
        }

        .char-badge {
            background: rgba(15, 17, 26, 0.9);
            border: 2px solid var(--primary-neon);
            padding: 10px 24px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.25);
            transition: border-color 0.4s ease;
        }

        .char-badge-top {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--primary-neon);
            transition: color 0.4s ease;
        }

        .char-badge-bottom {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .nav-instruction {
            position: absolute;
            bottom: -25px;
            right: 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #666;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .mouse-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            z-index: 20;
        }
        .mouse-zone.left { left: 0; }
        .mouse-zone.right { right: 0; }

        /* NUEVOS ESTILOS PARA SELECCIÓN PLAYER 1 / PLAYER 2 Y MODO VS */
        .vs-status-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: -10px;
            margin-bottom: 5px;
            z-index: 10;
        }

        .select-prompt {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 4px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            text-transform: uppercase;
            animation: glowPrompt 1.5s infinite alternate;
        }

        .select-prompt.p1-turn {
            color: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }

        .select-prompt.p2-turn {
            color: #00e5ff;
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .vs-matchup-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 10px;
            z-index: 10;
        }

        .player-vs-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(12, 14, 22, 0.85);
            padding: 8px 18px;
            border-radius: 8px;
            border: 2px solid #444;
            min-width: 240px;
            transition: all 0.3s ease;
        }

        .player-vs-box.p1-box {
            border-color: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.25);
        }

        .player-vs-box.p2-box {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
            flex-direction: row-reverse;
        }

        .player-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .p1-box .player-tag {
            background: #ff3366;
            color: #fff;
        }

        .p2-box .player-tag {
            background: #00e5ff;
            color: #000;
        }

        .player-vs-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .vs-badge-icon {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            font-style: italic;
            color: #ffcc00;
            text-shadow: 0 0 15px #ffcc00;
            animation: pulseVS 1s infinite alternate;
        }

        .btn-vs-action {
            background: linear-gradient(135deg, #ffcc00, #ff6600);
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-vs-action:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(255, 204, 0, 0.7);
        }

        .card-p1-indicator, .card-p2-indicator {
            position: absolute;
            top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        .card-p1-indicator {
            left: 10px;
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 8px #ff3366;
        }

        .card-p2-indicator {
            right: 10px;
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 8px #00e5ff;
        }

        @keyframes pulseVS {
            from { transform: scale(0.95); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        @keyframes glowPrompt {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        /* OVERLAY INICIO / START SYSTEM */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 6, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00;
            letter-spacing: 4px;
            border: 3px solid #ffcc00;
            padding: 15px 40px;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            animation: pulse 1.5s infinite;
        }

        .start-subtext {
            margin-top: 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- OVERLAY PRESS START -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-btn">PRESS START</div>
        <div class="start-subtext">HAZ CLIC PARA INICIAR EL SHOWCASE Y ACTIVAR AUDIO</div>
    </div>

    <div class="mouse-zone left" id="zoneLeft"></div>
    <div class="mouse-zone right" id="zoneRight"></div>

    <div class="showcase-container">
        <div class="showcase-header">
            <div class="title-group">
                <div class="title-line-1" id="headerLine1">KYO KUSANAGI</div>
                <div class="title-line-2">FIGHTING SHOWCASE</div>
            </div>
            <div class="shirou-badge" id="shirouBadge">
                <div class="shirou-text">҂shirou</div>
                <div class="shirou-id">(1525823861)</div>
            </div>
        </div>

        <div class="carousel-stage" id="carouselStage"></div>

        <!-- INDICADOR DE TURNO SELECCIÓN -->
        <div class="vs-status-bar">
            <div class="select-prompt p1-turn" id="selectPrompt">PLAYER 1: SELECCIONE PERSONAJE</div>
        </div>

        <!-- SECCIÓN VS ABAJO DEL CARRUSEL -->
        <div class="vs-matchup-container">
            <div class="player-vs-box p1-box">
                <span class="player-tag">P1</span>
                <span class="player-vs-name" id="p1Name">SELECCIONANDO...</span>
            </div>

            <div class="vs-badge-icon">VS</div>

            <div class="player-vs-box p2-box">
                <span class="player-tag">P2</span>
                <span class="player-vs-name" id="p2Name">EN ESPERA...</span>
            </div>

            <button class="btn-vs-action" id="resetVsBtn">REINICIAR VS</button>
        </div>

        <div class="showcase-footer">
            <div class="music-player">
                <div class="track-icon" id="trackIcon" title="Cambiar pista de música">♫</div>
                <div class="track-info">
                    <div class="track-title" id="trackTitle">酔いどれ知らず</div>
                    <div class="track-artist" id="trackArtist">【Kanaria】</div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="prevTrackBtn" title="Pista Anterior">⏮</button>
                    <button class="ctrl-btn" id="playBtn" title="Reproducir / Pausa">▶</button>
                    <button class="ctrl-btn" id="nextTrackBtn" title="Siguiente Pista">⏭</button>
                </div>
            </div>

            <div class="char-badge" id="charBadge">
                <span class="char-badge-top" id="badgeTop">KYO KUSANAGI</span>
                <span class="char-badge-bottom">ARCADE FIGHTER</span>
            </div>
        </div>

        <div class="nav-instruction">◄ MOVER CURSOR A LOS EXTREMOS PARA NAVEGAR ►</div>
    </div>

    <!-- CANCIONES DE MÚSICA -->
    <audio src="assets/0.mp3" class="cancion active" title="酔いどれ知らず" data-artist="【Kanaria】"></audio>
    <audio src="assets/1.mp3" class="cancion" title="Esaka!! (KOF Theme)" data-artist="【SNK Sound Team】"></audio>
    <audio src="assets/2.mp3" class="cancion" title="Lonely Wolf" data-artist="【Garou Asset Mix】"></audio>
    <audio src="assets/3.mp3" class="cancion" title="Arashi no Saxophone" data-artist="【Iori Theme Asset】"></audio>
    <audio src="assets/4.mp3" class="cancion" title="Final Boss Theme" data-artist="【Boss Asset】"></audio>

    <!-- EFECTOS DE SONIDO DE ARCHIVO -->
    <audio src="assets/A.mp3" class="sfx" id="sfxIntro" preload="auto"></audio>
    <!-- REPRODUCTOR DE VOZ / NARRADOR DE PERSONAJE -->
    <audio id="sfxVoice" preload="auto"></audio>

    <script>
        const characters = [
            { id: "kyo", name: "Kyo Kusanagi", color: "#ffcc00", img: "https://i.ibb.co/K1gG66D/Dise-o-sin-t-tulo-2.png", voice: "/assets/voices/kyo.mp3" },
            { id: "rugal", name: "Rugal Bernstein", color: "#00e5ff", img: "https://i.ibb.co/TBBmMtrZ/Dise-o-sin-t-tulo-3.png", voice: "/assets/voices/rugal.mp3" },
            { id: "kula", name: "Kula Diamond", color: "#ff3366", img: "https://i.ibb.co/RGwBVR6C/Dise-o-sin-t-tulo-4.png", voice: "/assets/voices/kula.mp3" },
            { id: "chris", name: "Orochi Chris", color: "#cc33ff", img: "https://i.ibb.co/tT9TtC2v/Dise-o-sin-t-tulo-9.png", voice: "/assets/voices/chris.mp3" },
            { id: "rock", name: "Rock Howard", color: "#00ffcc", img: "https://i.ibb.co/yc474VCs/Dise-o-sin-t-tulo-11.png", voice: "/assets/voices/rock.mp3" },
            { id: "terry", name: "Terry Bogard", color: "#ff9900", img: "https://i.ibb.co/Q3bx92nJ/Dise-o-sin-t-tulo-7.png", voice: "/assets/voices/terry.mp3" },
            { id: "mary", name: "Blue Mary", color: "#33ff66", img: "https://i.ibb.co/GvkJT2Cd/Dise-o-sin-t-tulo-10.png", voice: "/assets/voices/mary.mp3" },
            { id: "mai", name: "Mai Shiranui", color: "#ff33cc", img: "https://i.ibb.co/k2WG43vk/Dise-o-sin-t-tulo-5.png", voice: "/assets/voices/mai.mp3" },
            { id: "leona", name: "Leona Heidern", color: "#33ccff", img: "https://i.ibb.co/4wyYJXGW/Dise-o-sin-t-tulo-8.png", voice: "/assets/voices/leona.mp3" },
            { id: "iori", name: "Iori Yagami", color: "#ff3333", img: "https://i.ibb.co/3Y9yw4z3/Dise-o-sin-t-tulo-6.png", voice: "/assets/voices/iori.mp3" }
        ];

        // LÓGICA DE SELECCIÓN DE JUGADORES (P1 Y P2)
        let player1Char = null;
        let player2Char = null;
        let currentSelectingPlayer = 1; // 1 para Player 1, 2 para Player 2

        const selectPrompt = document.getElementById('selectPrompt');
        const p1NameEl = document.getElementById('p1Name');
        const p2NameEl = document.getElementById('p2Name');
        const resetVsBtn = document.getElementById('resetVsBtn');

        function updateVsDisplay() {
            if (player1Char) {
                p1NameEl.textContent = player1Char.name;
            } else {
                p1NameEl.textContent = "SELECCIONANDO...";
            }

            if (player2Char) {
                p2NameEl.textContent = player2Char.name;
            } else {
                p2NameEl.textContent = player1Char ? "SELECCIONANDO..." : "EN ESPERA...";
            }

            if (!player1Char) {
                currentSelectingPlayer = 1;
                selectPrompt.textContent = "PLAYER 1: SELECCIONE PERSONAJE";
                selectPrompt.className = "select-prompt p1-turn";
            } else if (!player2Char) {
                currentSelectingPlayer = 2;
                selectPrompt.textContent = "PLAYER 2: SELECCIONE PERSONAJE";
                selectPrompt.className = "select-prompt p2-turn";
            } else {
                selectPrompt.textContent = "¡QUE COMIENCE LA PELEA!";
                selectPrompt.className = "select-prompt";
            }
        }

        resetVsBtn.addEventListener('click', () => {
            player1Char = null;
            player2Char = null;
            currentSelectingPlayer = 1;
            updateVsDisplay();
            renderCarousel();
        });

        // 1. REPRODUCTOR DE MÚSICA
        const audioTracks = document.querySelectorAll('audio.cancion');
        let currentTrackIndex = 0;
        let isPlaying = false;

        const playBtn = document.getElementById('playBtn');
        const prevTrackBtn = document.getElementById('prevTrackBtn');
        const nextTrackBtn = document.getElementById('nextTrackBtn');
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');

        function loadTrack(index) {
            audioTracks.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
                audio.classList.remove('active');
            });

            currentTrackIndex = index;
            const currentAudio = audioTracks[currentTrackIndex];
            currentAudio.classList.add('active');

            trackTitleEl.textContent = currentAudio.getAttribute('title') || 'Pista sin título';
            trackArtistEl.textContent = currentAudio.getAttribute('data-artist') || '【Asset】';
        }

        loadTrack(0);

        playBtn.addEventListener('click', () => {
            const currentAudio = audioTracks[currentTrackIndex];
            if (isPlaying) {
                currentAudio.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
            } else {
                currentAudio.play().then(() => {
                    playBtn.textContent = '❚❚';
                    isPlaying = true;
                }).catch(e => console.log(e));
            }
        });

        function nextTrack() {
            const wasPlaying = isPlaying;
            audioTracks[currentTrackIndex].pause();
            audioTracks[currentTrackIndex].currentTime = 0;
            currentTrackIndex = (currentTrackIndex + 1) % audioTracks.length;
            loadTrack(currentTrackIndex);
            if (wasPlaying) {
                audioTracks[currentTrackIndex].play().catch(e => {});
                playBtn.textContent = '❚❚';
                isPlaying = true;
            }
        }

        prevTrackBtn.addEventListener('click', () => {
            const wasPlaying = isPlaying;
            audioTracks[currentTrackIndex].pause();
            audioTracks[currentTrackIndex].currentTime = 0;
            currentTrackIndex = (currentTrackIndex - 1 + audioTracks.length) % audioTracks.length;
            loadTrack(currentTrackIndex);
            if (wasPlaying) {
                audioTracks[currentTrackIndex].play().catch(e => {});
                playBtn.textContent = '❚❚';
                isPlaying = true;
            }
        });

        nextTrackBtn.addEventListener('click', nextTrack);
        document.getElementById('trackIcon').addEventListener('click', nextTrack);

        // 2. EFECTOS DE SONIDO Y NARRADOR
        const sfxIntro = document.getElementById('sfxIntro');
        const sfxVoice = document.getElementById('sfxVoice');

        function playSfx(audioElement) {
            if (!audioElement) return;
            audioElement.currentTime = 0;
            audioElement.play().catch(e => {});
        }

        // Reproduce la voz del personaje directamente
        function playCharacterVoice(voicePath) {
            if (!voicePath) return;

            sfxVoice.src = voicePath;
            sfxVoice.currentTime = 0;
            sfxVoice.play().catch(e => console.log("Error al reproducir voz:", e));
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Sonido sintético arcade para movimiento entre personajes
        function playSyntheticNavSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(1200, now + 0.04);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } catch(e) {}
        }

        // 3. CARRUSEL Y ANIMACIÓN INICIAL AL CARGAR
        let currentIndex = 0;
        let lastNavTime = 0;
        const navCooldown = 650;
        let isOpeningAnimating = true;

        const stage = document.getElementById('carouselStage');
        const headerLine1 = document.getElementById('headerLine1');
        const badgeTop = document.getElementById('badgeTop');

        function updateTheme(color) {
            document.documentElement.style.setProperty('--primary-neon', color);
        }

        function renderCarousel() {
            stage.innerHTML = '';
            const char = characters[currentIndex];
            
            headerLine1.textContent = char.name;
            badgeTop.textContent = char.name;
            updateTheme(char.color);

            const prevIndex = (currentIndex - 1 + characters.length) % characters.length;
            const nextIndex = (currentIndex + 1) % characters.length;

            const indicesToShow = [
                { idx: prevIndex, pos: 'side-left' },
                { idx: currentIndex, pos: 'center' },
                { idx: nextIndex, pos: 'side-right' }
            ];

            indicesToShow.forEach(item => {
                const c = characters[item.idx];
                slot = document.createElement('div');
                slot.className = `card-slot ${item.pos}`;

                let indicatorHtml = '';
                if (player1Char && player1Char.name === c.name) {
                    indicatorHtml += `<div class="card-p1-indicator">P1</div>`;
                }
                if (player2Char && player2Char.name === c.name) {
                    indicatorHtml += `<div class="card-p2-indicator">P2</div>`;
                }

                slot.innerHTML = `
                    <div class="card-frame">
                        ${indicatorHtml}
                        <div class="character-img-container">
                            <img src="${c.img}" alt="${c.name}" onerror="this.src='https://placehold.co/400x600/0b0f19/ffffff?text=${encodeURIComponent(c.name)}'">
                        </div>
                        ${item.pos === 'center' ? `<div class="card-overlay-info"><div class="main-name">${c.name}</div></div>` : ''}
                    </div>
                `;

                // Al hacer clic en la tarjeta central: Reproduce la voz del personaje directamente (/assets/voices/personaje.mp3)
                slot.addEventListener('click', () => {
                    if (isOpeningAnimating) return;
                    if (item.pos === 'center') {
                        // Reproducir sonido de voz directamente del objeto del personaje
                        playCharacterVoice(c.voice);
                        
                        // Asignación de Player 1 y Player 2
                        if (!player1Char) {
                            player1Char = c;
                            currentSelectingPlayer = 2;
                        } else if (!player2Char && c.name !== player1Char.name) {
                            player2Char = c;
                        }
                        updateVsDisplay();
                        renderCarousel();
                    } else {
                        currentIndex = item.idx;
                        playSyntheticNavSound();
                        renderCarousel();
                    }
                });

                stage.appendChild(slot);
            });
        }

        function navigate(direction) {
            if (isOpeningAnimating) return;
            const now = Date.now();
            if (now - lastNavTime < navCooldown) return;
            lastNavTime = now;

            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % characters.length;
            } else {
                currentIndex = (currentIndex - 1 + characters.length) % characters.length;
            }
            playSyntheticNavSound();
            renderCarousel();
        }

        // Animación rápida de apertura recorriendo los 10 personajes
        function runOpeningShowcase() {
            playSfx(sfxIntro);
            let count = 0;
            const totalSteps = 12;
            const intervalTime = 110;

            const randomIndices = Array.from({ length: totalSteps }, () => 
                Math.floor(Math.random() * characters.length)
            );

            const showcaseInterval = setInterval(() => {
                currentIndex = randomIndices[count];
                playSyntheticNavSound();
                renderCarousel();
                count++;

                if (count >= totalSteps) {
                    clearInterval(showcaseInterval);
                    currentIndex = Math.floor(Math.random() * characters.length);
                    playSyntheticNavSound();
                    renderCarousel();
                    isOpeningAnimating = false;
                }
            }, intervalTime);
        }

        document.getElementById('zoneLeft').addEventListener('mouseenter', () => navigate('prev'));
        document.getElementById('zoneRight').addEventListener('mouseenter', () => navigate('next'));

        // INTERACCIÓN START OVERLAY PARA ACTIVAR AUDIO SIN BLOQUEOS
        const startOverlay = document.getElementById('startOverlay');
        startOverlay.addEventListener('click', () => {
            getAudioContext();
            startOverlay.style.opacity = '0';
            setTimeout(() => {
                startOverlay.style.display = 'none';
                renderCarousel();
                updateVsDisplay();
                runOpeningShowcase();
            }, 500);
        });

        window.addEventListener('load', () => {
            renderCarousel();
            updateVsDisplay();
        });
    </script>
</body>
</html>
